<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ClickUp Link Copier</title>
  </head>
  <body>
    <header>
      <h1 id="heading">Your list</h1>
      <button id="clear" class="text-btn" hidden>Clear list</button>
    </header>

    <section id="list-view" hidden>
      <p class="caption">Pastes as</p>
      <ul id="items" class="items" aria-label="Tasks in your list"></ul>
    </section>

    <section id="empty" class="empty" hidden>
      <p>
        In ClickUp, hold <kbd class="alt"></kbd> and click tasks to add them, or use
        <span class="chip"><span id="add-icon"></span>Add to list</span> on an open task.
      </p>
    </section>

    <div class="actions">
      <button id="copy" class="primary" disabled></button>
      <p class="shortcut">or press <kbd id="copy-all-kbd"></kbd> in ClickUp</p>
    </div>

    <details class="settings">
      <summary>Paste settings</summary>
      <div class="settings-body">
        <label class="check check-first">
          <input type="checkbox" id="include-id" />
          <span>Put the task ID before the title, like <span class="sample">[APP-123] Title</span></span>
        </label>
        <label class="field">
          <span class="field-label">Plain-text format</span>
          <select id="plain-format">
            <option value="markdown">Markdown: [Title](url)</option>
            <option value="title-url">Title — url</option>
            <option value="url">URL only</option>
          </select>
          <span class="field-help">
            Used where rich text isn’t supported, like code editors and terminals. Slack, Notion, Docs and Gmail always
            get clickable titles.
          </span>
        </label>
        <label class="check">
          <input type="checkbox" id="clear-after" />
          <span>Clear the list after copying</span>
        </label>
      </div>
    </details>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
